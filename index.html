<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Field Guide - personal AI agents, compared plainly</title>
<meta name="description" content="Forty personal AI agents with what they do, what they cost and where they run. Every entry links to the official source.">
<meta name="theme-color" content="#FAFAF7">

<style>
:root{--canvas:#FAFAF7;--surface:#fff;--ink:#17211D;--ink2:#56635B;--action:#176B4D;--line:#D7DED8;--err:#B42318;
--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;--s8:64px;
--gutter:20px;--max:1120px;--r:8px;--rm:12px;--fast:100ms;--mid:200ms;--in:240ms;--out:160ms;
--out-ease:cubic-bezier(0,0,.2,1);--in-ease:cubic-bezier(.4,0,1,1)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--canvas);color:var(--ink);font:400 18px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:var(--action)}
:focus-visible{outline:3px solid var(--action);outline-offset:2px;border-radius:var(--r)}
.wrap{max-width:var(--max);margin:0 auto;padding:0 var(--gutter)}
header.top{border-bottom:1px solid var(--line);background:var(--canvas)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;min-height:64px}
.brand{display:flex;align-items:center;gap:var(--s3);font-weight:650;font-size:18px;color:var(--ink);text-decoration:none;min-height:44px}
.brand i{width:24px;height:24px;border-radius:var(--r);background:var(--action);position:relative;display:block}
.brand i:after{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--canvas)}
.toplink{color:var(--ink2);font-size:16px;text-decoration:none;min-height:44px;display:inline-flex;align-items:center;transition:color var(--fast) var(--out-ease)}
.toplink:hover{color:var(--ink)}
.hero{padding:var(--s7) 0 var(--s5)}
h1{font-size:clamp(32px,6vw,48px);line-height:1.1;letter-spacing:-.02em;margin:0 0 var(--s3);font-weight:700;max-width:20ch}
.lede{color:var(--ink2);margin:0 0 var(--s5);max-width:52ch}
.search{position:relative;max-width:560px}
.search input{width:100%;height:52px;padding:0 var(--s4) 0 48px;font:inherit;font-size:18px;color:var(--ink);background:var(--surface);border:1px solid var(--ink2);border-radius:var(--r);transition:border-color var(--fast) var(--out-ease)}
.search input::placeholder{color:var(--ink2)}
.search svg{position:absolute;left:var(--s4);top:16px;width:20px;height:20px;stroke:var(--ink2);fill:none;stroke-width:2}
.filters{display:flex;flex-wrap:wrap;gap:var(--s2);margin:var(--s4) 0 0;padding:0;border:0}
.chip{min-height:44px;padding:0 var(--s4);font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);cursor:pointer;transition:background var(--fast) var(--out-ease),border-color var(--fast) var(--out-ease),color var(--fast) var(--out-ease)}
.chip:hover{border-color:var(--ink2)}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--canvas)}
.sep{width:1px;background:var(--line);margin:var(--s2) var(--s1)}
.meta{display:flex;justify-content:space-between;align-items:center;margin:var(--s5) 0 var(--s3);color:var(--ink2);font-size:16px}
.reset{background:none;border:0;font:inherit;font-size:16px;color:var(--action);cursor:pointer;min-height:44px;padding:0 var(--s2);text-decoration:underline}
ul.list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr;gap:var(--s3)}
.card{display:flex;gap:var(--s4);align-items:flex-start;min-height:88px;padding:var(--s4);background:var(--surface);border:1px solid var(--line);border-radius:var(--rm);text-decoration:none;color:inherit;transition:border-color var(--fast) var(--out-ease),transform var(--fast) var(--out-ease)}
.card:hover{border-color:var(--action)}
.card:active{transform:scale(.995)}
.logo{flex:none;width:48px;height:48px;border-radius:var(--r);background:var(--ink);display:grid;place-items:center;color:var(--canvas);font-weight:700;font-size:20px}
.logo img{width:32px;height:32px;display:block}
.card h2{margin:0;font-size:18px;line-height:1.3;font-weight:650}
.card p{margin:var(--s1) 0 0;color:var(--ink2);font-size:16px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.badges{display:flex;gap:var(--s2);flex-wrap:wrap;margin-top:var(--s2)}
.b{font-size:14px;line-height:1;padding:6px var(--s2);border-radius:var(--s1);border:1px solid var(--line);color:var(--ink2);letter-spacing:.02em}
.b.p{color:var(--action);border-color:var(--action)}
.empty{padding:var(--s7) 0;color:var(--ink2)}
.empty b{display:block;color:var(--ink);font-size:20px;margin-bottom:var(--s2)}
footer{margin-top:var(--s8);border-top:1px solid var(--line);padding:var(--s5) 0 var(--s7);color:var(--ink2);font-size:16px}
/* detail */
.back{display:inline-flex;align-items:center;gap:var(--s2);min-height:44px;margin:var(--s4) 0 var(--s2);color:var(--action);text-decoration:none;font-size:16px}
.d-head{display:flex;gap:var(--s4);align-items:center;margin-bottom:var(--s5)}
.d-head .logo{width:64px;height:64px}.d-head .logo img{width:44px;height:44px}
.d-head h1{margin:0;font-size:clamp(28px,5vw,40px);max-width:none}
.d-lede{font-size:20px;line-height:1.5;margin:0 0 var(--s5);max-width:56ch}
dl{margin:0 0 var(--s5);border-top:1px solid var(--line);max-width:720px}
dl div{display:grid;grid-template-columns:1fr;gap:var(--s1);padding:var(--s4) 0;border-bottom:1px solid var(--line)}
dt{color:var(--ink2);font-size:14px;letter-spacing:.06em;text-transform:uppercase}
dd{margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 var(--s5);background:var(--action);color:#fff;border-radius:var(--r);text-decoration:none;font-weight:600;font-size:18px;transition:background var(--fast) var(--out-ease)}
.btn:hover{background:#125a40}
.note{margin-top:var(--s4);color:var(--ink2);font-size:16px;max-width:56ch}
#view{animation:in var(--in) var(--out-ease)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(min-width:768px){
 :root{--gutter:32px}
 ul.list{grid-template-columns:repeat(2,1fr)}
 dl div{grid-template-columns:200px 1fr;gap:var(--s5)}
 .hero{padding:var(--s8) 0 var(--s6)}
}
@media(min-width:1100px){ul.list{grid-template-columns:repeat(3,1fr)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

const $=s=>document.querySelector(s),view=$('#view');
const TYPES={TEXT:'Text',APP:'App',WEB:'Web',OSS:'Open source'};
const PRICES=['Free','Freemium','Paid'];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const logo=a=>`<span class="logo" aria-hidden="true">${a.logo?`<img src="${a.logo}" alt="" width="32" height="32">`:esc(a.name[0].toUpperCase())}</span>`;
let q='',type='',price='';
function home(){
 document.title='Agent Field Guide - personal AI agents, compared plainly';
 view.innerHTML=`<section class="hero"><h1>Find the right AI agent.</h1><p class="lede">Forty personal agents. What each one does, what it costs and where it runs, from official sources.</p>
 <div class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="q" type="search" placeholder="Search by name or task" aria-label="Search agents" autocomplete="off" value="${esc(q)}"></div>
 <div class="filters" role="group" aria-label="Filter by type">${Object.entries(TYPES).map(([k,v])=>`<button class="chip" data-t="${k}" aria-pressed="${type===k}">${v}</button>`).join('')}<span class="sep"></span>${PRICES.map(p=>`<button class="chip" data-p="${p}" aria-pressed="${price===p}">${p}</button>`).join('')}</div></section>
 <div class="meta"><span id="count" role="status"></span><button class="reset" id="reset" hidden>Clear filters</button></div><div id="res"></div>`;
 $('#q').addEventListener('input',e=>{q=e.target.value;draw()});
 view.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{type=type===b.dataset.t?'':b.dataset.t;sync()});
 view.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{price=price===b.dataset.p?'':b.dataset.p;sync()});
 $('#reset').onclick=()=>{q='';type='';price='';$('#q').value='';sync()};
 draw();
}
function sync(){view.querySelectorAll('[data-t]').forEach(b=>b.setAttribute('aria-pressed',type===b.dataset.t));view.querySelectorAll('[data-p]').forEach(b=>b.setAttribute('aria-pressed',price===b.dataset.p));draw()}
function draw(){
 const t=q.trim().toLowerCase();
 const r=DATA.filter(a=>(!type||a.types.includes(type))&&(!price||a.price===price)&&(!t||(a.name+' '+a.tag).toLowerCase().includes(t)));
 $('#count').textContent=r.length===DATA.length?`${r.length} agents`:`${r.length} of ${DATA.length} agents`;
 $('#reset').hidden=!(q||type||price);
 $('#res').innerHTML=r.length?`<ul class="list">${r.map(a=>`<li><a class="card" href="#/${a.id}">${logo(a)}<span><h2>${esc(a.name)}</h2><p>${esc(a.tag)}</p><span class="badges">${a.types.map(x=>`<span class="b">${TYPES[x]}</span>`).join('')}${a.price?`<span class="b p">${a.price}</span>`:''}</span></span></a></li>`).join('')}</ul>`:`<div class="empty"><b>No agent matches.</b>Try a shorter search or clear the filters.</div>`;
}
function detail(id){
 const a=DATA.find(x=>x.id===id);if(!a){location.hash='#/';return}
 document.title=a.name+' - Agent Field Guide';
 const row=(k,v)=>v&&v!=='—'?`<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`:'';
 view.innerHTML=`<a class="back" href="#/">&larr; All agents</a><div class="d-head">${logo(a)}<h1>${esc(a.name)}</h1></div>
 <p class="d-lede">${esc(a.tag)}</p>
 <dl>${row('Type',a.types.map(x=>TYPES[x]).join(', '))}${row('Price',a.price)}${row('Pricing details',a.pricing)}${row('Where it runs',a.platform)}</dl>
 <a class="btn" href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">Open official page</a>
 <p class="note">Opens ${esc(new URL(a.url).hostname.replace(/^www\./,''))} in a new tab. Prices and plans change, so confirm there.</p>`;
}
function route(){const h=location.hash.replace(/^#\/?/,'');if(h==='about'){home();document.getElementById('about').scrollIntoView();return}h?detail(h):home();if(h)window.scrollTo(0,0)}
addEventListener('hashchange',route);route();
</script>
</body>
</html>
